[project]
name = "speak"
version = "1.6.0"
description = "MCP speech server for Claude Code."
requires-python = ">=3.12"
dependencies = [
    "speak-core",
    "mcp>=2.1,<3",
    "sounddevice>=0.5.6",
]

[project.scripts]
speak-mcp = "speak.__main__:main"
speak-talk = "speak.talk:main"
speak-telemetry = "speak.telemetry.commands:telemetry_main"
speak-stats = "speak.telemetry.commands:stats_main"

[tool.uv.sources]
speak-core = { path = "../speak-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speak"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-timeout>=2.3",
    "ruff>=0.14",
    "mypy>=1.18",
    "jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Vendored verbatim from the speak-telemetry repo's contract/v1/; a checksum test
# fails the build if this copy drifts from upstream, so it must never be
# reformatted or "fixed" to this repo's own style. `force-exclude` is required
# because `tests/` is passed explicitly on the gate command line, and `exclude`
# alone is skipped for explicitly-named paths.
extend-exclude = ["tests/contract/v1"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "LOG", "G"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The queue's tests wait on events rather than sleeping, so a regression that stops
# the worker hangs the test instead of failing it. A red test is worth more than a
# job that runs until the CI limit.
timeout = 30

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sounddevice"]
ignore_missing_imports = true
