[project]
name = "voicebox"
version = "1.0.0"
description = "Offline transcription, voice-overs and read-aloud for coding agents, on NVIDIA NeMo-Speech.cpp."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "speak-core @ git+https://github.com/danilogr/speak-core@v0.4.0",
    "mcp>=2.1,<3",
]

[project.scripts]
voicebox-mcp = "voicebox.__main__:main"
voicebox-telemetry = "voicebox.telemetry.commands:telemetry_main"
voicebox-stats = "voicebox.telemetry.commands:stats_main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Direct references are how speak-core is depended on (a git tag), and hatchling
# refuses them without this.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/voicebox"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-timeout>=2.3",
    "ruff>=0.14",
    "mypy>=1.18",
    "jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Vendored verbatim from the voicebox-telemetry repo's contract/v1/; a checksum test
# fails the build if this copy drifts from upstream, so it must never be
# reformatted or "fixed" to this repo's own style. `force-exclude` is required
# because `tests/` is passed explicitly on the gate command line, and `exclude`
# alone is skipped for explicitly-named paths.
extend-exclude = ["tests/contract/v1"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "LOG", "G"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The queue's tests wait on events rather than sleeping, so a regression that stops
# the worker hangs the test instead of failing it. A red test is worth more than a
# job that runs until the CI limit.
timeout = 30

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
