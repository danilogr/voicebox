<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #F4F4F6; }
      .shadow { fill: #D6D7DC; }
      .outline { fill: #181A20; }
      .body-dark { fill: #2A2F3D; }
      .body-light { fill: #484F65; }
      .faceplate { fill: #E8E6DF; }
      .screen-bg { fill: #111318; }
      .orange-dark { fill: #D44211; }
      .orange-mid { fill: #FF5722; }
      .orange-light { fill: #FF8A50; }
      .amber { fill: #FFA726; }
      .green-led { fill: #00E676; }
      .text-line { fill: #E8E6DF; }
    </style>
  </defs>

  <!-- Clean Squircle Canvas Badge -->
  <rect x="0" y="0" width="32" height="32" rx="6" class="bg" shape-rendering="auto" />

  <!-- Drop Shadow -->
  <rect x="7" y="28" width="18" height="1" class="shadow" />
  <rect x="9" y="29" width="14" height="1" class="shadow" />

  <!-- === VOICEBOX HARDWARE CHASSIS === -->
  <!-- Outer Outline with Stepped Corners -->
  <rect x="6" y="6" width="20" height="21" class="outline" />
  <rect x="5" y="7" width="22" height="19" class="outline" />

  <!-- Chassis Fill (Charcoal/Dark Slate) -->
  <rect x="6" y="7" width="20" height="19" class="body-dark" />
  <!-- Top & Left Bevel Highlight -->
  <rect x="7" y="7" width="18" height="1" class="body-light" />
  <rect x="6" y="8" width="1" height="17" class="body-light" />

  <!-- Status LED (Top Left: Local / Active) -->
  <rect x="7" y="9" width="2" height="1" class="green-led" />

  <!-- Top Volume Knob (Orange Accent) -->
  <rect x="22" y="4" width="3" height="3" class="outline" />
  <rect x="23" y="5" width="1" height="1" class="orange-mid" />

  <!-- === FACEPLATE INSERT (Bone/Cream) === -->
  <rect x="8" y="10" width="16" height="15" class="outline" />
  <rect x="9" y="11" width="14" height="13" class="faceplate" />

  <!-- === LEFT: TRANSCRIBE SCREEN (Audio Waveform -> Text) === -->
  <!-- Dark CRT Screen Bezel -->
  <rect x="10" y="12" width="6" height="7" class="outline" />
  <rect x="11" y="13" width="4" height="5" class="screen-bg" />

  <!-- Glowing Sound Waveform (Speech in) -->
  <rect x="11" y="14" width="1" height="2" class="amber" />
  <rect x="12" y="13" width="1" height="3" class="green-led" />
  <rect x="13" y="14" width="1" height="2" class="amber" />

  <!-- Transcribed Text Line + Blinking Cursor (Text out) -->
  <rect x="11" y="16" width="2" height="1" class="text-line" />
  <rect x="13" y="16" width="1" height="1" class="orange-mid" />

  <!-- === RIGHT: NARRATE SPEAKER (Acoustic Cone Aloud) === -->
  <!-- Speaker Housing Outline -->
  <rect x="18" y="12" width="4" height="7" class="outline" />
  <rect x="17" y="13" width="6" height="5" class="outline" />

  <!-- Speaker Cone Interior -->
  <rect x="18" y="13" width="4" height="5" class="body-dark" />
  <rect x="19" y="14" width="2" height="3" class="orange-mid" />
  <rect x="19" y="15" width="2" height="1" class="amber" />

  <!-- Radiating Stepped Sound Wave (Projecting Right) -->
  <rect x="24" y="13" width="1" height="1" class="orange-light" />
  <rect x="25" y="14" width="1" height="3" class="orange-mid" />
  <rect x="24" y="17" width="1" height="1" class="orange-light" />

  <rect x="26" y="12" width="1" height="1" class="amber" />
  <rect x="27" y="13" width="1" height="5" class="amber" />
  <rect x="26" y="18" width="1" height="1" class="amber" />

  <!-- === BOTTOM CONTROL: PUSH-TO-TALK BUTTON === -->
  <rect x="12" y="20" width="8" height="3" class="outline" />
  <rect x="13" y="21" width="6" height="1" class="orange-mid" />
  <rect x="13" y="21" width="6" height="1" class="orange-light" />
  <rect x="13" y="22" width="6" height="1" class="orange-dark" />
</svg>
