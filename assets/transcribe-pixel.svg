<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #F4F4F6; }
      .shadow { fill: #D6D7DC; }
      .outline { fill: #181A20; }
      .body-dark { fill: #2A2F3D; }
      .body-mid { fill: #383E50; }
      .body-light { fill: #484F65; }
      .cream { fill: #E8E6DF; }
      .cream-dark { fill: #D5D3CA; }
      .orange-dark { fill: #D44211; }
      .orange-mid { fill: #FF5722; }
      .orange-light { fill: #FF8A50; }
      .amber { fill: #FFA726; }
      .green-led { fill: #00E676; }
      .text-line { fill: #2A2F3D; }
    </style>
  </defs>

  <!-- Canvas Squircle Badge -->
  <rect x="0" y="0" width="32" height="32" rx="6" class="bg" shape-rendering="auto" />

  <!-- Drop Shadow -->
  <rect x="7" y="29" width="18" height="1" class="shadow" />
  <rect x="9" y="30" width="14" height="1" class="shadow" />

  <!-- === CASSETTE TAPE (AUDIO SOURCE) === -->
  <!-- Cassette Outline -->
  <rect x="6" y="5" width="20" height="13" class="outline" />
  <rect x="5" y="6" width="22" height="11" class="outline" />

  <!-- Cassette Shell Fill -->
  <rect x="6" y="6" width="20" height="11" class="body-dark" />
  <rect x="7" y="6" width="18" height="1" class="body-light" />
  <rect x="6" y="7" width="1" height="9" class="body-light" />

  <!-- Label Insert (Cream) -->
  <rect x="8" y="8" width="16" height="7" class="cream" />
  <rect x="8" y="8" width="16" height="1" class="cream-dark" />

  <!-- Tape Window (Dark Inset) -->
  <rect x="11" y="9" width="10" height="5" class="outline" />
  <rect x="12" y="10" width="8" height="3" class="body-dark" />

  <!-- Left Reel (Orange/Amber with center hole) -->
  <rect x="13" y="10" width="2" height="3" class="orange-mid" />
  <rect x="12" y="11" width="4" height="1" class="orange-mid" />
  <rect x="13" y="11" width="1" height="1" class="cream" />

  <!-- Right Reel (Orange/Amber with center hole) -->
  <rect x="17" y="10" width="2" height="3" class="amber" />
  <rect x="16" y="11" width="4" height="1" class="amber" />
  <rect x="18" y="11" width="1" height="1" class="cream" />

  <!-- Status LED (Local / Offline Active) -->
  <rect x="23" y="7" width="2" height="1" class="green-led" />

  <!-- Audio Waveform Bridge (Audio to Text Flow) -->
  <rect x="13" y="17" width="1" height="2" class="orange-mid" />
  <rect x="15" y="16" width="1" height="3" class="amber" />
  <rect x="17" y="16" width="1" height="4" class="orange-light" />
  <rect x="19" y="17" width="1" height="2" class="orange-mid" />

  <!-- === TRANSCRIPT DOCUMENT (TEXT OUTPUT) === -->
  <!-- Document Outline -->
  <rect x="9" y="19" width="14" height="10" class="outline" />
  <!-- Folded Corner Outline -->
  <rect x="21" y="19" width="2" height="2" class="outline" />

  <!-- Document Sheet Fill (Cream) -->
  <rect x="10" y="20" width="12" height="8" class="cream" />
  <rect x="20" y="20" width="2" height="2" class="cream-dark" />

  <!-- Transcript Lines (Text Rows) -->
  <!-- Line 1 -->
  <rect x="11" y="22" width="7" height="1" class="text-line" />
  <!-- Line 2 -->
  <rect x="11" y="24" width="10" height="1" class="text-line" />
  <!-- Line 3 -->
  <rect x="11" y="26" width="8" height="1" class="text-line" />
  <!-- Timestamp / Diarization Accent Dot -->
  <rect x="19" y="22" width="2" height="1" class="orange-mid" />
</svg>
