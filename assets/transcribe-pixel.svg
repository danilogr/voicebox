<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #F4F4F6; }
      .shadow { fill: #D6D7DC; }
      .outline { fill: #181A20; }
      .body-dark { fill: #2A2F3D; }
      .body-light { fill: #484F65; }
      .cream { fill: #E8E6DF; }
      .cream-dark { fill: #D5D3CA; }
      .orange-mid { fill: #FF5722; }
      .orange-light { fill: #FF8A50; }
      .amber { fill: #FFA726; }
      .green-led { fill: #00E676; }
      .text-line { fill: #2A2F3D; }
    </style>
  </defs>

  <!-- Clean Canvas Squircle Badge -->
  <rect x="0" y="0" width="32" height="32" rx="6" class="bg" shape-rendering="auto" />

  <!-- Drop Shadow -->
  <rect x="6" y="27" width="20" height="1" class="shadow" />
  <rect x="8" y="28" width="16" height="1" class="shadow" />

  <!-- === CASSETTE TAPE BODY === -->
  <!-- Outer Outline with stepped corners -->
  <rect x="5" y="7" width="22" height="19" class="outline" />
  <rect x="4" y="8" width="24" height="17" class="outline" />

  <!-- Cassette Shell Fill (Dark Slate) -->
  <rect x="5" y="8" width="22" height="17" class="body-dark" />
  <!-- Top & Left Bevel Highlight -->
  <rect x="6" y="8" width="20" height="1" class="body-light" />
  <rect x="5" y="9" width="1" height="15" class="body-light" />

  <!-- Status LED (Top Left: Local / Offline) -->
  <rect x="6" y="10" width="2" height="1" class="green-led" />

  <!-- === CASSETTE LABEL / TRANSCRIPT SHEET (Cream) === -->
  <rect x="7" y="11" width="18" height="12" class="outline" />
  <rect x="8" y="12" width="16" height="10" class="cream" />
  <rect x="8" y="12" width="16" height="1" class="cream-dark" />

  <!-- === TAPE REELS WINDOW === -->
  <rect x="10" y="13" width="12" height="4" class="outline" />
  <rect x="11" y="14" width="10" height="2" class="body-dark" />

  <!-- Left Reel (Signal Orange) -->
  <rect x="12" y="14" width="2" height="2" class="orange-mid" />
  <rect x="13" y="14" width="1" height="1" class="cream" />

  <!-- Right Reel (Amber) -->
  <rect x="18" y="14" width="2" height="2" class="amber" />
  <rect x="18" y="15" width="1" height="1" class="cream" />

  <!-- Connecting Tape Ribbon -->
  <rect x="14" y="15" width="4" height="1" class="orange-light" />

  <!-- === TRANSCRIPT LINES (Audio converted to text) === -->
  <!-- Line 1 with Speaker / Diarization Accent -->
  <rect x="10" y="18" width="2" height="1" class="orange-mid" />
  <rect x="13" y="18" width="7" height="1" class="text-line" />

  <!-- Line 2 -->
  <rect x="10" y="20" width="10" height="1" class="text-line" />

  <!-- Bottom Tape Notch (Hardware Detail) -->
  <rect x="12" y="24" width="8" height="1" class="outline" />
  <rect x="13" y="24" width="6" height="1" class="body-dark" />
</svg>
