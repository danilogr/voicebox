<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #F4F4F6; }
      .shadow { fill: #D6D7DC; }
      .outline { fill: #181A20; }
      .body-dark { fill: #2A2F3D; }
      .body-mid { fill: #383E50; }
      .body-light { fill: #484F65; }
      .faceplate { fill: #E8E6DF; }
      .faceplate-dark { fill: #D5D3CA; }
      .screen-bg { fill: #111318; }
      .orange-dark { fill: #D44211; }
      .orange-mid { fill: #FF5722; }
      .orange-light { fill: #FF8A50; }
      .amber { fill: #FFA726; }
      .green-led { fill: #00E676; }
      .text-dark { fill: #2A2F3D; }
      .screw { fill: #7E869B; }
    </style>
  </defs>

  <!-- Canvas Squircle Badge -->
  <rect x="0" y="0" width="64" height="64" rx="12" class="bg" shape-rendering="auto" />

  <!-- Drop Shadow -->
  <rect x="10" y="56" width="44" height="2" class="shadow" />
  <rect x="14" y="58" width="36" height="2" class="shadow" />

  <!-- === TOP HARDWARE ACCENTS & BROADCAST WAVES === -->
  <!-- Left Microphone / Antenna Stub -->
  <rect x="12" y="10" width="4" height="6" class="outline" />
  <rect x="13" y="10" width="2" height="2" class="orange-mid" />
  <rect x="13" y="12" width="2" height="4" class="body-light" />

  <!-- Top Rotary Tuning Knob -->
  <rect x="42" y="10" width="6" height="6" class="outline" />
  <rect x="43" y="11" width="4" height="4" class="amber" />
  <rect x="44" y="12" width="2" height="2" class="orange-dark" />

  <!-- Radiating Speech Waves (Top Right Arcs) -->
  <rect x="50" y="8" width="3" height="2" class="orange-light" />
  <rect x="53" y="10" width="2" height="4" class="orange-light" />

  <rect x="54" y="4" width="4" height="2" class="amber" />
  <rect x="58" y="6" width="2" height="6" class="amber" />

  <rect x="58" y="0" width="4" height="2" class="orange-mid" />
  <rect x="62" y="2" width="2" height="8" class="orange-mid" />

  <!-- === MAIN VOICEBOX CONSOLE CHASSIS === -->
  <!-- Outer Outline with Stepped Rounded Corners -->
  <rect x="8" y="16" width="48" height="40" class="outline" />
  <rect x="7" y="18" width="50" height="36" class="outline" />

  <!-- Chassis Fill (Dark Slate) -->
  <rect x="8" y="18" width="48" height="36" class="body-dark" />
  <rect x="9" y="17" width="46" height="2" class="body-light" />
  <rect x="8" y="19" width="2" height="34" class="body-light" />
  <rect x="9" y="52" width="46" height="2" class="body-mid" />

  <!-- Hardware Screws on Chassis Corners -->
  <rect x="10" y="19" width="2" height="2" class="screw" />
  <rect x="52" y="19" width="2" height="2" class="screw" />
  <rect x="10" y="50" width="2" height="2" class="screw" />
  <rect x="52" y="50" width="2" height="2" class="screw" />

  <!-- Status LED (Top Center-Left) -->
  <rect x="14" y="20" width="4" height="2" class="outline" />
  <rect x="15" y="20" width="2" height="2" class="green-led" />

  <!-- === FACEPLATE INSERT (Cream) === -->
  <rect x="11" y="23" width="42" height="26" class="outline" />
  <rect x="12" y="24" width="40" height="24" class="faceplate" />
  <rect x="12" y="24" width="40" height="2" class="faceplate-dark" />

  <!-- === LEFT MODULE: TRANSCRIBE (Tape Deck & Transcript Lines) === -->
  <!-- Tape Bezel Outline -->
  <rect x="14" y="27" width="13" height="8" class="outline" />
  <rect x="15" y="28" width="11" height="6" class="body-dark" />

  <!-- Left Tape Reel (Signal Orange) -->
  <rect x="16" y="29" width="3" height="4" class="orange-mid" />
  <rect x="17" y="30" width="1" height="2" class="cream" />

  <!-- Right Tape Reel (Amber) -->
  <rect x="22" y="29" width="3" height="4" class="amber" />
  <rect x="23" y="30" width="1" height="2" class="cream" />

  <!-- Tape Path -->
  <rect x="19" y="31" width="3" height="1" class="orange-light" />

  <!-- Transcript Lines Below Tape -->
  <rect x="14" y="37" width="13" height="2" class="text-dark" />
  <rect x="14" y="41" width="9" height="2" class="text-dark" />
  <rect x="24" y="41" width="2" height="2" class="orange-mid" />

  <!-- === CENTER MODULE: EQUALIZER / SPECTRUM DISPLAY === -->
  <rect x="29" y="27" width="6" height="16" class="outline" />
  <rect x="30" y="28" width="4" height="14" class="screen-bg" />

  <!-- Dynamic Equalizer Sound Bars -->
  <!-- Bar 1 -->
  <rect x="31" y="36" width="1" height="5" class="green-led" />
  <rect x="31" y="34" width="1" height="1" class="amber" />
  <!-- Bar 2 -->
  <rect x="32" y="32" width="1" height="9" class="green-led" />
  <rect x="32" y="30" width="1" height="1" class="orange-mid" />

  <!-- === RIGHT MODULE: NARRATE (Speaker Cone & Sound Horn) === -->
  <!-- Speaker Bezel Outline -->
  <rect x="37" y="27" width="14" height="10" class="outline" />
  <rect x="38" y="28" width="12" height="8" class="body-dark" />

  <!-- Concentric Speaker Cone -->
  <rect x="40" y="29" width="8" height="6" class="orange-dark" />
  <rect x="42" y="30" width="4" height="4" class="orange-mid" />
  <rect x="43" y="31" width="2" height="2" class="amber" />

  <!-- Acoustic Grille Corner Accents -->
  <rect x="39" y="29" width="1" height="1" class="body-mid" />
  <rect x="48" y="29" width="1" height="1" class="body-mid" />
  <rect x="39" y="34" width="1" height="1" class="body-mid" />
  <rect x="48" y="34" width="1" height="1" class="body-mid" />

  <!-- === BOTTOM CONTROL DECK === -->
  <!-- Push-to-Talk (PTT) Button (Signal Orange) -->
  <rect x="37" y="39" width="7" height="5" class="outline" />
  <rect x="38" y="40" width="5" height="3" class="orange-mid" />
  <rect x="38" y="40" width="5" height="1" class="orange-light" />
  <rect x="38" y="42" width="5" height="1" class="orange-dark" />

  <!-- Rotary Volume Knob -->
  <rect x="46" y="39" width="5" height="5" class="outline" />
  <rect x="47" y="40" width="3" height="3" class="amber" />
  <rect x="48" y="41" width="1" height="1" class="orange-dark" />
</svg>
