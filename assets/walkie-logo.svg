<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="100%" height="100%">
  <defs>
    <filter id="logo-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Squircle Canvas Badge -->
    <rect x="0" y="0" width="180" height="180" rx="42" fill="#FBFBFC" stroke="#ECECEF" stroke-width="1.5" filter="url(#logo-shadow)" />

    <!-- Radio Waves (Warm Signal Orange) -->
    <path d="M 86 28 A 16 16 0 0 1 94 38" fill="none" stroke="#FF8C42" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 94 22 A 26 26 0 0 1 106 39" fill="none" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 102 16 A 36 36 0 0 1 118 40" fill="none" stroke="#E25822" stroke-width="4.5" stroke-linecap="round" />

    <!-- Antenna -->
    <rect x="68" y="34" width="8" height="36" rx="4" fill="#2A2F3D" />
    <!-- Dial -->
    <rect x="116" y="55" width="14" height="10" rx="3" fill="#FF8C42" />
    <!-- PTT Button -->
    <rect x="47" y="94" width="7" height="28" rx="3.5" fill="#FF6B35" />

    <!-- Main Body -->
    <rect x="52" y="62" width="88" height="104" rx="18" fill="#20242E" stroke="#2D3342" stroke-width="1.5" />

    <!-- Faceplate Inset -->
    <rect x="58" y="68" width="76" height="92" rx="14" fill="#181B22" />

    <!-- Screen -->
    <rect x="64" y="74" width="64" height="30" rx="8" fill="#0C0E12" />
    <!-- Waveform bars -->
    <rect x="74" y="87" width="2.5" height="5" rx="1.2" fill="#FF8C42" opacity="0.6" />
    <rect x="79" y="83" width="2.5" height="13" rx="1.2" fill="#FF8C42" />
    <rect x="84" y="80" width="2.5" height="19" rx="1.2" fill="#FF6B35" />
    <rect x="89" y="84" width="2.5" height="11" rx="1.2" fill="#FF8C42" />
    <rect x="94" y="78" width="2.5" height="23" rx="1.2" fill="#FF6B35" />
    <rect x="99" y="82" width="2.5" height="15" rx="1.2" fill="#FF8C42" />
    <rect x="104" y="85" width="2.5" height="9" rx="1.2" fill="#FF8C42" />
    <rect x="109" y="88" width="2.5" height="3" rx="1.2" fill="#FF8C42" opacity="0.6" />

    <!-- Speaker Acoustic Slits -->
    <rect x="73" y="116" width="46" height="3" rx="1.5" fill="#323A4D" />
    <rect x="73" y="123" width="46" height="3" rx="1.5" fill="#323A4D" />
    <rect x="73" y="130" width="46" height="3" rx="1.5" fill="#323A4D" />
    <rect x="73" y="137" width="46" height="3" rx="1.5" fill="#323A4D" />
    <rect x="73" y="144" width="46" height="3" rx="1.5" fill="#323A4D" />
  </g>

  <!-- Typography: Wordmark "walkie" in modern geometric sans -->
  <g transform="translate(225, 114)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', Roboto, sans-serif"
          font-size="82"
          font-weight="800"
          letter-spacing="-2"
          fill="#111827">
      walkie
    </text>
    <!-- Dot accent over 'i' in warm signal orange -->
    <circle cx="370" cy="-62" r="7.5" fill="#FF6B35" />
  </g>

  <!-- Subtitle: Clean monospace or technical descriptor -->
  <g transform="translate(228, 154)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', Roboto, sans-serif"
          font-size="20"
          font-weight="500"
          letter-spacing="0.4"
          fill="#6B7280">
      Voice &amp; Audio Transcription for Claude Code
    </text>
  </g>
</svg>
