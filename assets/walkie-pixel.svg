<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Background Canvas Palette -->
    <style>
      .bg { fill: #F4F4F6; }
      .shadow { fill: #D6D7DC; }
      .outline { fill: #181A20; }
      .body-dark { fill: #2A2F3D; }
      .body-mid { fill: #383E50; }
      .body-light { fill: #484F65; }
      .faceplate { fill: #E8E6DF; }
      .screen-bg { fill: #111318; }
      .orange-dark { fill: #D44211; }
      .orange-mid { fill: #FF5722; }
      .orange-light { fill: #FF8A50; }
      .wave-amber { fill: #FFA726; }
      .green-led { fill: #00E676; }
      .grille { fill: #505668; }
    </style>
  </defs>

  <!-- Canvas Background Squircle Border/Base -->
  <rect x="0" y="0" width="32" height="32" rx="6" class="bg" shape-rendering="auto" />

  <!-- Pixel Drop Shadow underneath -->
  <rect x="9" y="29" width="14" height="1" class="shadow" />
  <rect x="11" y="30" width="10" height="1" class="shadow" />

  <!-- Radio Broadcast Waves (8-bit stepped pixel arcs) -->
  <!-- Inner Arc (Orange Light) -->
  <rect x="15" y="4" width="2" height="1" class="orange-light" />
  <rect x="17" y="5" width="1" height="2" class="orange-light" />
  <rect x="18" y="7" width="1" height="2" class="orange-light" />

  <!-- Outer Arc (Orange Mid) -->
  <rect x="17" y="1" width="3" height="1" class="orange-mid" />
  <rect x="20" y="2" width="1" height="2" class="orange-mid" />
  <rect x="21" y="4" width="1" height="2" class="orange-mid" />
  <rect x="22" y="6" width="1" height="3" class="orange-mid" />

  <!-- Outer Arc (Orange Dark) -->
  <rect x="19" y="0" width="3" height="1" class="orange-dark" />
  <rect x="22" y="1" width="1" height="1" class="orange-dark" />
  <rect x="23" y="2" width="1" height="2" class="orange-dark" />
  <rect x="24" y="4" width="1" height="3" class="orange-dark" />
  <rect x="25" y="7" width="1" height="3" class="orange-dark" />

  <!-- Antenna (Top Left) -->
  <!-- Outline -->
  <rect x="10" y="4" width="3" height="7" class="outline" />
  <!-- Fill & Highlight -->
  <rect x="11" y="5" width="1" height="5" class="body-mid" />
  <rect x="12" y="5" width="1" height="5" class="body-light" />
  <rect x="11" y="4" width="1" height="1" class="orange-mid" />

  <!-- Channel Knob (Top Right) -->
  <!-- Outline -->
  <rect x="18" y="8" width="4" height="3" class="outline" />
  <!-- Fill -->
  <rect x="19" y="9" width="2" height="2" class="orange-mid" />
  <rect x="19" y="9" width="1" height="1" class="orange-light" />

  <!-- Push-to-Talk (PTT) Button (Side Left) -->
  <!-- Outline -->
  <rect x="6" y="16" width="3" height="6" class="outline" />
  <!-- Fill -->
  <rect x="7" y="17" width="2" height="4" class="orange-mid" />
  <rect x="7" y="17" width="1" height="3" class="orange-light" />
  <rect x="8" y="20" width="1" height="1" class="orange-dark" />

  <!-- Main Body Outline -->
  <!-- Horizontal borders -->
  <rect x="10" y="10" width="12" height="1" class="outline" />
  <rect x="10" y="28" width="12" height="1" class="outline" />
  <!-- Vertical borders -->
  <rect x="8" y="12" width="1" height="15" class="outline" />
  <rect x="23" y="12" width="1" height="15" class="outline" />
  <!-- Stepped rounded corners -->
  <rect x="9" y="11" width="1" height="1" class="outline" />
  <rect x="22" y="11" width="1" height="1" class="outline" />
  <rect x="9" y="27" width="1" height="1" class="outline" />
  <rect x="22" y="27" width="1" height="1" class="outline" />

  <!-- Main Body Fill (Charcoal/Dark Slate) -->
  <rect x="9" y="12" width="14" height="15" class="body-dark" />
  <rect x="10" y="11" width="12" height="1" class="body-light" />
  <rect x="9" y="12" width="1" height="14" class="body-light" />
  <rect x="22" y="12" width="1" height="14" class="body-dark" />
  <rect x="10" y="27" width="12" height="1" class="body-dark" />

  <!-- Faceplate Panel (Warm Sand/Bone) -->
  <!-- Faceplate Outline/Border -->
  <rect x="11" y="12" width="10" height="14" class="outline" />
  <!-- Faceplate Fill -->
  <rect x="12" y="13" width="8" height="12" class="faceplate" />

  <!-- OLED Display Screen -->
  <!-- Screen Outline -->
  <rect x="12" y="13" width="8" height="5" class="outline" />
  <!-- Screen Fill -->
  <rect x="13" y="14" width="6" height="3" class="screen-bg" />

  <!-- Audio Waveform on Screen (Amber / Orange pixels) -->
  <rect x="13" y="15" width="1" height="1" class="orange-light" />
  <rect x="14" y="14" width="1" height="3" class="wave-amber" />
  <rect x="15" y="15" width="1" height="1" class="orange-mid" />
  <rect x="16" y="14" width="1" height="3" class="wave-amber" />
  <rect x="17" y="15" width="1" height="1" class="orange-light" />
  <rect x="18" y="14" width="1" height="1" class="green-led" />

  <!-- Speaker Grille (8-bit Horizontal Acoustic Slits) -->
  <rect x="13" y="20" width="6" height="1" class="outline" />
  <rect x="13" y="22" width="6" height="1" class="outline" />
  <rect x="13" y="24" width="6" height="1" class="outline" />

  <!-- Subtle Speaker Slit Shading -->
  <rect x="13" y="21" width="6" height="1" class="grille" opacity="0.3" />
  <rect x="13" y="23" width="6" height="1" class="grille" opacity="0.3" />
</svg>
