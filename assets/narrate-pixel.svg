<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #F4F4F6; }
      .shadow { fill: #D6D7DC; }
      .outline { fill: #181A20; }
      .body-dark { fill: #2A2F3D; }
      .body-mid { fill: #383E50; }
      .body-light { fill: #484F65; }
      .cream { fill: #E8E6DF; }
      .cream-dark { fill: #D5D3CA; }
      .orange-dark { fill: #D44211; }
      .orange-mid { fill: #FF5722; }
      .orange-light { fill: #FF8A50; }
      .amber { fill: #FFA726; }
      .green-led { fill: #00E676; }
      .text-line { fill: #2A2F3D; }
    </style>
  </defs>

  <!-- Clean Canvas Squircle Badge -->
  <rect x="0" y="0" width="32" height="32" rx="6" class="bg" shape-rendering="auto" />

  <!-- Drop Shadow -->
  <rect x="6" y="27" width="20" height="1" class="shadow" />
  <rect x="8" y="28" width="16" height="1" class="shadow" />

  <!-- === OPEN DOCUMENT / BOOK (LEFT HALF: TEXT SOURCE) === -->
  <!-- Left Page Outline -->
  <rect x="4" y="8" width="11" height="18" class="outline" />
  <!-- Left Page Fill (Cream) -->
  <rect x="5" y="9" width="9" height="16" class="cream" />
  <rect x="5" y="9" width="9" height="1" class="cream-dark" />

  <!-- 3 Bold, Clean Text Lines (High readability, no micro-clutter) -->
  <rect x="6" y="12" width="7" height="1" class="text-line" />
  <rect x="6" y="15" width="6" height="1" class="text-line" />
  <rect x="6" y="18" width="7" height="1" class="text-line" />
  <rect x="6" y="21" width="4" height="1" class="orange-mid" />

  <!-- Book Spine / Center Divider -->
  <rect x="14" y="8" width="2" height="18" class="outline" />
  <rect x="14" y="9" width="1" height="16" class="body-dark" />

  <!-- Status LED (Top Left) -->
  <rect x="5" y="6" width="2" height="1" class="green-led" />

  <!-- === SPEAKER CONE HORN (RIGHT HALF: AUDIO OUTPUT) === -->
  <!-- Speaker Base -->
  <rect x="16" y="13" width="2" height="8" class="outline" />
  <rect x="16" y="14" width="1" height="6" class="body-mid" />

  <!-- Expanding Horn Body -->
  <rect x="18" y="12" width="2" height="10" class="outline" />
  <rect x="18" y="13" width="2" height="8" class="body-dark" />

  <!-- Horn Bell -->
  <rect x="20" y="11" width="3" height="12" class="outline" />
  <rect x="20" y="12" width="2" height="10" class="orange-dark" />
  <rect x="22" y="13" width="1" height="8" class="orange-mid" />

  <!-- === CLEAN RADIATING SOUND WAVES (2 ARCS) === -->
  <!-- Inner Wave Arc (Amber) -->
  <rect x="24" y="13" width="1" height="2" class="amber" />
  <rect x="25" y="14" width="1" height="4" class="amber" />
  <rect x="24" y="17" width="1" height="2" class="amber" />

  <!-- Outer Wave Arc (Signal Orange) -->
  <rect x="27" y="11" width="1" height="2" class="orange-mid" />
  <rect x="28" y="13" width="1" height="6" class="orange-mid" />
  <rect x="27" y="19" width="1" height="2" class="orange-mid" />
</svg>
